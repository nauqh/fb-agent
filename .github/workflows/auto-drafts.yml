# Auto-drafts, hourly. Requirements: the auto-drafts PRD.
#
# Which Pages, which sources, how many drafts and what times are each Page's own
# setting, on Settings > This Page > Auto-drafts. This file only asks the API
# which Pages are due; a Page with no times is skipped and runs only on Run now.
#
# Hourly rather than once at 06:00 because the times are the operator's. The
# route compares now with each Page's most recent configured time and the last
# run, so most hours queue nothing. GitHub runs scheduled jobs late often
# enough that the commitment is "within the hour", not an exact minute.

name: Auto-drafts

on:
  schedule:
    - cron: "5 * * * *"

  workflow_dispatch:
    inputs:
      page_ids:
        description: "Page ids, comma separated. Blank runs every Page switched on."
        required: false
        default: ""

permissions: {}

env:
  API: https://fb-agent.up.railway.app
  # The hero is the only variable cost in an unattended run. true reuses the
  # competitor's own picture instead of buying one.
  HERO_FROM_SOURCE: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    # The route answers 202 as soon as the rows exist; the writing happens in
    # the API process afterwards. This waits for the hand-off, not the drafts.
    timeout-minutes: 5

    steps:
      - name: Run due Pages, or the dispatch's Pages now
        env:
          API_KEY: ${{ secrets.FB_AGENT_API_KEY }}
          # Through the environment rather than inline `${{ }}`, so a dispatch
          # input is data and never shell.
          INPUT_PAGE_IDS: ${{ inputs.page_ids }}
        run: |
          set -euo pipefail

          if [ -z "${API_KEY:-}" ]; then
            echo "::error::FB_AGENT_API_KEY is not set in repository secrets"
            exit 1
          fi

          # A scheduled tick runs only what is due. A manual dispatch is the
          # operator asking for it now, so it forces the Pages it names.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            url="$API/generate/auto/due"
            body=$(jq -nc --argjson hero "$HERO_FROM_SOURCE" \
              '{hero_from_source: $hero}')
            label="due Pages"
          else
            url="$API/generate/auto"
            ids="${INPUT_PAGE_IDS:-}"
            if [ -n "$ids" ]; then
              body=$(jq -nc --argjson ids "[$ids]" --argjson hero "$HERO_FROM_SOURCE" \
                '{page_ids: $ids, hero_from_source: $hero}')
            else
              body=$(jq -nc --argjson hero "$HERO_FROM_SOURCE" '{hero_from_source: $hero}')
            fi
            label="dispatch"
          fi
          echo "Requesting $label: $body"

          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$url" \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")

          if [ "$code" != "202" ]; then
            echo "::error::$url answered $code"
            cat response.json
            exit 1
          fi

          # A scheduled empty list means nothing was due, which is the normal
          # case on most hours. On a dispatch it means no Page had anything
          # left to write about, or none is switched on.
          echo "Queued $(jq 'length' response.json) $label: $(cat response.json)"
