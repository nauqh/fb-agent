# How wide a window Source Items are drawn through. Both numbers global.
#
# Separate from layout.yml on purpose. That file describes the Composed Image,
# and a Page that wants its own overrides it with a `page_layout` row rather
# than with a section in the file.
#
# **The feed list is no longer here.** It is `feed` rows, added and removed from
# Settings, because it is the one part of this file an operator has to change
# without a deploy and this API runs from a container image: a write to this
# file lasts until the next deploy and disagrees with the committed copy in the
# meantime. The publisher name still lands on the Source Item as `author`.
#
# What stayed is what a form cannot help with. Changing `since_days` is a
# judgement about a beat, made once, and reading it as a diff is the point.

rss:
    # These publishers cover history, where a five-day-old story is still good
    # post material. A tighter window buys freshness the beat does not need and
    # empties the grid on a quiet weekend, which reads as broken.
    since_days: 7
    # The grid is browsed, not paged.
    max_items: 50

# Both numbers stay global, and the news page is the reason to say so. The
# obvious move when The Fact Feed arrived was a per-page `since_days` — a
# 24-hour beat under a seven-day window looked wrong. Measured, it never binds:
# `_merge` windows, sorts newest-first, *then* caps, and that page's feeds put
# 306 deduplicated items into the last few hours, so the 50-item cap leaves the
# oldest thing in its grid 10 hours old. A per-page window would be
# configuration that cannot change an outcome, which is the kind that rots.

competitors:
    lookback_days: 7
    # How many competitor posts the grid shows. Every post in the window is
    # stored — they arrive on sync and cost nothing — but a week runs to several
    # hundred across seventeen competitor pages, and the tail below this is not
    # what anyone browses for.
    grid_limit: 60

# ---------------------------------------------------------------------------
# Feeds that were probed and *not* kept.
#
# Kept here because a `feed` row can only record a feed that exists. This is the
# other half of the same evidence, and without it the next person re-probes the
# same dead ends and re-reaches the same conclusions. `Feed.note` carries the
# measurements for the twelve that did earn a place; the seed migration moved
# them across verbatim.
#
# Probed 2026-07-31, for the history beat:
#   Smithsonian Smart News  277 items, swamps max_items on recency alone
#   Live Science /all,      superseded by the tag feeds they overlap
#     ScienceDaily Fossils
#   Archaeology Magazine    101-char summaries are thin fuel
#   Ancient Origins,        403 even with a User-Agent
#     HeritageDaily,
#     GreekReporter
#
# Probed 2026-08-09, 29 candidates, for the news beat. That beat is the opposite
# of the history one: posts are 24-72h old at publish, so volume is enormous and
# the constraint is crowding rather than drought.
#   AP, Reuters             DNS no longer resolves for either feed path
#   IFLScience              403 even with the User-Agent
#   CNN edition             parses, but its newest item is years stale
#   UPI Odd News            the natural fit for the offbeat lane, and unusable:
#                           newest entry 45h old against a grid spanning 10, so
#                           it contributed 0 of 50 in every variant
#   BBC Sport               72 fresh items with pictures, and it swamps: adding
#                           it pulled the window 10.2h -> 6.0h and the median
#                           summary 424 -> 359 chars. This page does post sport;
#                           if the operator misses it, it is one row to add
#   NPR, Al Jazeera, CBS,   no images at all
#     Newsweek, DW
#   Politico                newest item 22.9h, slower than The Hill on the beat
#
# Google News is excluded by design rather than by measurement: its items carry
# no summary and an unresolvable redirect link, which is weak input for a
# Factual Source that has to be written about accurately.
