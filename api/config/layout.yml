# The one Composed Image form.
#
# Every Page renders identically — only the watermark file differs. Values are
# History Retraced's, verified against the composite path actually taken for a
# `card` draft, not just against the template row. See
# docs/data-model.md#layout-is-config-not-data.
#
# This file has no per-page section and should not grow one. A setting that
# genuinely varies by Page belongs in the `page` table, not here.

image:
    width: 896
    height: 1120 # 4:5 — the tallest ratio Facebook renders in feed
    # Corners are square. The old code still computes a radius but the compositor
    # hardcodes `const cornerRadius = 0` (image-composite.ts:313); the preview
    # helper was zeroed to match (brand-image-layout.ts:111). Don't reintroduce it.
    edge_margin_ratio: 0.02 # × width → 18px, used to inset the watermark

panel:
    # Fraction of image height reserved for the text panel. A floor, not a cap:
    # the panel grows to fit the text, up to `max_ratio`. The hero occupies
    # (1 - actual ratio). Also feeds the image-gen prompt hint, so changing it
    # changes how the hero is composed.
    ratio: 0.20
    max_ratio: 0.85
    color: "#000000"
    opacity: 1.0

text:
    # Fixed. There is no autofit — `planOverlayLayout` reads `fontSizePx` once
    # (overlay-layout-plan.ts:248) and the panel grows instead of the type
    # shrinking. The old font_min/font_max columns were never read.
    font_size_px: 36
    line_height_ratio: 1.26
    align: center
    color: "#ffffff"
    padding:
        left_px: 5
        right_px: 5
        top_px: 15
        bottom_px: 15

highlight:
    color: "#F5C542" # gold, for phrases the writer marks verbatim

watermark:
    # Top-right of the hero, inset by edge_margin — the position was verified
    # against the newest composite in production storage, which prints "History
    # Retraced" as white text there because the stored logo had gone missing.
    # Reads page.watermark_image_path, a committed file under api/assets/, at its
    # natural aspect ratio. A missing file is an error: the old compositor
    # returned null and printed the name instead, and output degraded for months
    # without one failed post.
    max_px: 138 # capped again at 0.22 × width
    top_ratio: 0.014 # × hero height, floor 8px

portrait:
    # The circular inset: a picture the operator uploads, straddling the
    # hero/panel seam at the bottom-right, inset by edge_margin.
    #
    # Geometry is the old app's (brand-image-layout.ts:125-140 and
    # portrait-inset-shared.ts:5-17), which is where every number below comes
    # from — the ring is a stroke centred on the circle edge, so it needs 2px of
    # canvas outside the disc and gets 3.
    #
    # Nothing here generates the picture. The old app offered Upload and
    # Generate; only Upload is ported, so the inset is the one image in the app
    # that costs nothing and comes from a person. Its *size* is per-draft and
    # lives on the row, because it depends on what is in the picture rather than
    # on the brand.
    size_px: 140 # DEFAULT_PORTRAIT_SIZE_PX in the old app — the default, not a cap
    min_px: 40 # MIN_INSET_SIZE_PX; below this the disc is a smudge
    max_width_ratio: 0.45 # MAX_INSET_DIAMETER_RATIO — 403px at 896 wide
    ring_pad_px: 3
    border_width_px: 2 # the old app's default was 4, which read as a heavy outline
    border_color: "#000000" # reads as a cut-out where it crosses the panel

font:
    # family must match the TTF name table. resvg substitutes silently otherwise:
    # `font-family="Arial Bold"` renders a serif face and still returns a valid
    # PNG. tests/spike_text_render.py guards this by width.
    family: Arial
    weight: bold
    path: assets/fonts/Arial-Bold.ttf # measured and rasterised from this file


# No headline badge. It renders only under `if (isFullOverlay && label)`
# (image-composite.ts:367), and the full_overlay layout is cut.
