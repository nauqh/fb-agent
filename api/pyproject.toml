[project]
name = "fb-agent-api"
version = "0.1.0"
description = "Facebook Agent — draft factory"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-ai>=0.0.14",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "google-genai>=1.0",
    "resvg-py>=0.3.3",
    "fonttools>=4.60",
    "pillow>=11.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
