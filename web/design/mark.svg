<!--
  fb-agent mark — the Composed Image itself: a 4:5 card, the hero above, the
  text panel below the divider, and the gold Highlight Phrase inside it.

  An outline at lucide's geometry (24 viewBox, stroke-width 2), because the mark
  sits beside lucide icons in the rail and a solid card reads as a blob next to
  1.5px strokes. `web/design/icon.svg` — the favicon — stays solid: a tab strip has
  no stroked icons to match, and mass is what survives 16px there.

  Inherits `currentColor` so it survives a dark theme; the gold is fixed to
  #f5c542, the value the rendered post is stamped with. The in-app copy
  (`web/src/components/logo.tsx`) points that at `var(--gold)` instead.
-->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fb-agent">
  <rect x="5" y="3" width="14" height="18" rx="2.5" />
  <path d="M5 14h14" />
  <path d="M8.4 17.6h4.2" stroke="#f5c542" stroke-width="2.2" />
</svg>
